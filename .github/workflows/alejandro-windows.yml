name: Alejandro Windows build

# Unsigned Windows x64 installer for the Alejandro fork. The upstream release
# workflow only runs on pingdotgg/t3code and needs signing secrets.
on:
  push:
    branches: [main, "feat/alejandro-*"]
  workflow_dispatch:

concurrency:
  group: alejandro-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      - name: Ensure Electron runtime is installed
        run: vp run --filter "@t3tools/desktop" ensure:electron

      - name: Build installer
        run: vp run dist:desktop:win:x64

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alejandro-windows-x64
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
